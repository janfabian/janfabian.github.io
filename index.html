<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>UTC</title>
  <style>
    html, body { height: 100%; margin: 0; }
    body {
      display: grid;
      place-items: center;
      background: #fff;
      color: #111;
      font: 300 clamp(2.5rem, 12vw, 9rem)/1 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      font-variant-numeric: tabular-nums;
    }
    @media (prefers-color-scheme: dark) {
      body { background: #111; color: #eee; }
    }
  </style>
</head>
<body>
  <time id="t">--:--:--</time>
  <script>
    const t = document.getElementById("t");
    function tick() {
      const now = new Date();
      t.textContent = now.toISOString().slice(11, 19);
      t.dateTime = now.toISOString();
      setTimeout(tick, 1000 - now.getMilliseconds());
    }
    tick();
  </script>
</body>
</html>
